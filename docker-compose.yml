services:
  postgres:
    image: postgres:16
    container_name: postgres_curso
    environment:
      POSTGRES_USER: curso
      POSTGRES_PASSWORD: curso
      POSTGRES_DB: curso
    ports:
      - "5432:5432"
    volumes:
      - pg_curso_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/scripts:/scripts

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@curso.com
      PGADMIN_DEFAULT_PASSWORD: curso
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  mongo:
    image: mongo:7
    container_name: mongo_curso
    environment:
      MONGO_INITDB_ROOT_USERNAME: curso
      MONGO_INITDB_ROOT_PASSWORD: curso
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  pg_curso_data:
  pgadmin_data:
  mongo_data: